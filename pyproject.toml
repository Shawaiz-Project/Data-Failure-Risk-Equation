[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dfre"
version = "0.2.0"
description = "Data Failure Risk Equation — bounded nonlinear risk for joint data/AI degradation, with explainability, calibration, monitoring and serving"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shawaiz Ali" }]
keywords = ["data-quality", "mlops", "etl", "drift", "uncertainty", "risk", "monitoring", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
pandas      = ["pandas>=2.0"]
scipy       = ["scipy>=1.10"]
calibration = ["scikit-learn>=1.3"]
airflow     = ["apache-airflow>=2.8"]
prometheus  = ["prometheus-client>=0.19"]
serve       = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = [
  "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.4",
  "mypy>=1.9", "build>=1.2", "twine>=5.0",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5",
  "prometheus-client>=0.19",
]
all = [
  "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "apache-airflow>=2.8", "prometheus-client>=0.19",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5",
]

[project.scripts]
dfre = "dfre.cli:main"

[project.urls]
Homepage = "https://github.com/shawaiz-ali/dfre"
Repository = "https://github.com/shawaiz-ali/dfre"
Issues = "https://github.com/shawaiz-ali/dfre/issues"
Documentation = "https://dfre.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/dfre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
